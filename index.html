<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>jamsch renamer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="toolbar">
        <button class="toolbar-btn" id="addFiles">
          <span class="icon">📁</span>
          Add Files
        </button>
        <button class="toolbar-btn rename-btn" id="renameBtn">
          <span class="icon">✓</span>
          Rename All
        </button>
      </div>

      <div class="rule-management">
        <div class="rule-controls">
          <button class="rule-btn" id="addRule">
            <span class="icon">➕</span>
            Add
          </button>
          <button class="rule-btn" id="removeRule">
            <span class="icon">➖</span>
            Remove
          </button>
          <button class="rule-btn" id="upRule">
            <span class="icon">⬆️</span>
            Up
          </button>
          <button class="rule-btn" id="downRule">
            <span class="icon">⬇️</span>
            Down
          </button>
        </div>

        <div class="rules-table-container">
          <table class="rules-table" id="rulesTable" tabindex="0">
            <thead>
              <tr>
                <th width="30">#</th>
                <th width="40">✓</th>
                <th width="100">Rule</th>
                <th>Statement</th>
                <th width="48" aria-label="Rule actions"></th>
              </tr>
            </thead>
            <tbody id="rulesTableBody">
              <tr class="empty-rule">
                <td colspan="5" class="empty-message">
                  Click here to add a rule
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="file-actions">
        <button class="action-btn" id="selectAllFiles">
          <span class="icon">☑️</span>
          Select All
        </button>
        <button class="action-btn" id="deselectAllFiles">
          <span class="icon">☐</span>
          Deselect All
        </button>
        <button class="action-btn" id="removeSelectedFiles">
          <span class="icon">🗑️</span>
          Remove Selected
        </button>
        <button class="action-btn" id="clearAllFiles">
          <span class="icon">🧹</span>
          Clear All
        </button>
        <button class="action-btn" id="invertSelection">
          <span class="icon">🔄</span>
          Invert Selection
        </button>
      </div>

      <div class="file-section">
        <input
          type="file"
          id="fileInput"
          multiple
          accept="*/*"
          style="display: none"
        />
        <div class="file-table-container" id="fileTableContainer">
          <div class="drop-zone-wrapper drop-zone" id="dropZoneWrapper">
            <table class="file-table" id="fileTable" tabindex="0">
              <thead>
                <tr>
                  <th style="width: 80px">
                    <input
                      type="checkbox"
                      id="selectAllCheckbox"
                      title="Select/Deselect All"
                    />
                    <div class="resize-handle"></div>
                  </th>
                  <th style="width: 35%">
                    Name
                    <div class="resize-handle"></div>
                  </th>
                  <th style="width: 35%">
                    New Name
                    <div class="resize-handle"></div>
                  </th>
                  <th style="width: calc(30% - 80px)">Status</th>
                </tr>
              </thead>
              <tbody id="fileTableBody"></tbody>
            </table>
            <div class="drop-message" id="dropMessage">
              Drag your files here
            </div>
          </div>
        </div>
      </div>

      <div class="status-bar">
        <span id="fileCount">0 files</span>
      </div>
    </div>

    <script type="module" src="renamer.js"></script>
  </body>
</html>
